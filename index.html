<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꼬마 감자의 새싹 키우기 - 마름모의 넓이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b2a1e; --soft:#6b5444; --card:#fffdf7; --orange:#e8843c; --orange-d:#c9611f;
  --green:#5aa83a; --blue:#3a8dde; --red:#e05a4f; --shadow:0 12px 34px rgba(60,40,20,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
html,body{margin:0;height:100%;word-break:keep-all;overflow:hidden;overscroll-behavior:none;font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;color:inherit}
.jua{font-family:"Jua","Gowun Dodum",sans-serif}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#64b9ec 0%,#a9dcf6 45%,#e5f6fb 70%,#7fbf52 70.1%);user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;height:600px;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;height:600px;will-change:transform}
#skyL{width:100%}
.sun{position:absolute;right:9%;top:46px;width:78px;height:78px;border-radius:50%;background:radial-gradient(#fffbe3,#ffe07a);box-shadow:0 0 70px 30px rgba(255,236,150,.55)}
.cloud{position:absolute;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.92;animation:drift 38s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;top:-28px;left:18px}
.cloud::after{width:42px;height:42px;top:-18px;left:60px}
@keyframes drift{to{transform:translateX(90px)}}

/* ---------- 정류장(퀘스트 표지판) ---------- */
.station{position:absolute;width:96px;height:150px;transform:translate(-50%,-100%);z-index:3}
.station .post{position:absolute;left:43px;bottom:0;width:10px;height:72px;background:#8a5a33;border-radius:4px}
.station .board{position:absolute;left:2px;bottom:56px;width:92px;height:56px;background:linear-gradient(#cf9254,#a96d39);border:3px solid #7d4e27;border-radius:10px;color:#fff4dd;text-align:center;font-family:Jua,sans-serif;font-size:13px;line-height:1.05;padding-top:4px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.station .board b{display:block;font-size:21px;font-weight:normal}
.station .bubble{position:absolute;left:24px;top:0;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#fff8b8,#ffc93c);box-shadow:0 0 18px 6px rgba(255,214,80,.75);font-family:Jua,sans-serif;font-size:30px;color:#a0522d;animation:float 1.6s ease-in-out infinite}
.station.done .bubble{background:radial-gradient(#e0f8cf,#78c955);box-shadow:0 0 12px 4px rgba(120,210,90,.6);color:#fff;font-size:26px}
.station.pop .bubble{animation:burst .7s ease-out}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes burst{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(12deg)}100%{transform:scale(1)}}

/* ---------- 감자 캐릭터 ---------- */
#sq{position:absolute;width:113px;height:150px;transform:translate(-50%,-100%);z-index:5}
.sq-in{width:100%;height:100%}
#sq svg,.hero svg{width:100%;height:100%;overflow:visible;display:block}
.nametag{position:absolute;left:50%;top:-40px;transform:translateX(-50%);white-space:nowrap;background:#fff;border-radius:999px;padding:3px 11px;font-family:Jua,sans-serif;font-size:15px;color:#8a5a2b;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.nametag:empty{display:none}
.sq-leg-f,.sq-leg-b{transform-box:fill-box;transform-origin:50% 10%}
.sq-body{transform-box:view-box;transform-origin:60px 140px}
.sq-arm-l{transform-box:fill-box;transform-origin:100% 0%}
.sq-arm-r{transform-box:fill-box;transform-origin:0% 0%}
.sq-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.walking .sq-body{animation:waddle .3s ease-in-out infinite alternate}
.walking .sq-leg-f{animation:legA .3s ease-in-out infinite alternate}
.walking .sq-leg-b{animation:legB .3s ease-in-out infinite alternate}
.walking .sq-arm-l{animation:armA .3s ease-in-out infinite alternate}
.walking .sq-arm-r{animation:armB .3s ease-in-out infinite alternate}
.jump .sq-in{animation:jump .65s ease-out}
@keyframes waddle{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-3px)}}
@keyframes legA{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes legB{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes armA{from{transform:rotate(14deg)}to{transform:rotate(-22deg)}}
@keyframes armB{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-40px)}}
.sp{display:none;transform-box:view-box;transform-origin:60px 48px}
.sp.on{display:inline;animation:grow .9s cubic-bezier(.3,1.5,.5,1) both,sway 2.8s ease-in-out .9s infinite alternate}
@keyframes grow{0%{transform:scale(.05)}100%{transform:scale(1)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.dust{position:absolute;width:18px;height:10px;border-radius:50%;background:rgba(205,175,125,.75);z-index:4;animation:dust .75s ease-out forwards;pointer-events:none}
@keyframes dust{to{transform:translate(-26px,-10px) scale(2.3);opacity:0}}

/* ---------- 영양분 ---------- */
.acorn-drop{position:absolute;width:44px;height:50px;z-index:7;transform:translate(-50%,-50%);animation:fall 1.15s cubic-bezier(.45,0,.75,1) forwards;filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
.acorn-drop svg{width:100%;height:100%}
@keyframes fall{0%{transform:translate(-50%,-480px) rotate(-200deg)}72%{transform:translate(-50%,-50%) rotate(0)}84%{transform:translate(-50%,-85%)}100%{transform:translate(-50%,-50%)}}
.acorn-drop.collect{animation:collect .45s ease-in forwards}
@keyframes collect{to{transform:translate(-50%,40px) scale(.2);opacity:0}}
.plus1{position:absolute;z-index:8;font-family:Jua,sans-serif;font-size:30px;color:#fff;text-shadow:0 2px 0 #3f8f2c,0 0 10px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:up 1.1s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.say{position:absolute;z-index:9;transform:translate(-50%,-100%);max-width:250px;text-align:center;background:#fff;border:3px solid #bfe3a6;border-radius:18px;padding:8px 14px;font-family:Jua,sans-serif;font-size:17px;line-height:1.35;color:#3b6b25;box-shadow:0 5px 14px rgba(0,0,0,.2);animation:sayIn 2.9s ease both;pointer-events:none}
.say::after{content:"";position:absolute;left:50%;bottom:-10px;width:14px;height:14px;background:#fff;border-right:3px solid #bfe3a6;border-bottom:3px solid #bfe3a6;transform:translateX(-50%) rotate(45deg)}
@keyframes sayIn{0%{opacity:0;transform:translate(-50%,-70%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0}}
.spark{position:absolute;z-index:8;width:12px;height:12px;pointer-events:none;background:#ffe36a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(120deg);opacity:0}}
.tip{background:#eefaf0;border:2px solid #c7e8ce;border-radius:14px;padding:8px 12px;margin:8px 0;font-size:15px;color:#2f6a3b}
.end-nut{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.end-nut span{width:34px;height:40px}.end-nut svg{width:100%;height:100%}
.choices.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choices.pics .choice{margin:0;flex-direction:column;align-items:center;gap:2px;padding:8px}
.choices.pics .ctext{width:100%}
.choices.pics svg{width:100%;height:auto;display:block}
.t-card small{color:#8a7a6a}
/* (예전 아기 다람쥐 스타일 — 지금은 사용 안 함) */
.baby{position:absolute;width:84px;height:74px;transform:translate(-50%,-100%);z-index:6}
.baby:not(.show){visibility:hidden}
.baby .bin{width:100%;height:100%}
.baby.show .bin{animation:babyIn 1s cubic-bezier(.3,1.3,.6,1) both,hop .45s ease-in-out 1s infinite alternate}
.baby svg{transform:scaleX(-1)}
@keyframes babyIn{0%{transform:translate(var(--fx),var(--fy)) scale(.25);opacity:0}15%{opacity:1}55%{transform:translate(calc(var(--fx) * .45),calc(var(--fy) - 70px)) scale(.85)}100%{transform:none}}
@keyframes hop{to{transform:translateY(-12px)}}
.heart{position:absolute;z-index:8;font-size:26px;animation:heart 2.2s ease-out forwards;pointer-events:none}
@keyframes heart{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-150px) scale(1.2);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:confetti linear forwards}
@keyframes confetti{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;z-index:10;pointer-events:none}
#hud[hidden]{display:none}
.hud-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-family:Jua,sans-serif;font-size:19px;box-shadow:0 4px 12px rgba(0,0,0,.15);border:none}
.pill .ac{width:24px;height:28px}
.pill .ac svg{width:100%;height:100%}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.steps{gap:5px;padding:8px 12px}
.steps i{width:14px;height:14px;border-radius:50%;background:#e6dccd;display:block}
.steps i.done{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.steps i.now{background:#ffd34d;box-shadow:0 0 0 3px rgba(255,200,60,.45);animation:float 1s infinite}
#muteBtn{padding:6px 11px}

/* ---------- 오버레이 / 카드 ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(45,30,18,.38);z-index:20}
.overlay.show{display:flex}
.btn{font-family:Jua,sans-serif;font-size:21px;padding:12px 28px;border:none;border-radius:999px;color:#fff;background:linear-gradient(#80d151,#4fa52f);box-shadow:0 5px 0 #3a7f22,0 8px 16px rgba(0,0,0,.15);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a7f22}
.btn:disabled{filter:grayscale(.7) opacity(.6);cursor:default}
.btn.orange{background:linear-gradient(#ffaa5a,#e8843c);box-shadow:0 5px 0 #b45a1c,0 8px 16px rgba(0,0,0,.15)}
.btn.small{font-size:16px;padding:8px 16px}
.btn.gray{background:linear-gradient(#b8aa98,#8f806e);box-shadow:0 4px 0 #6d6052}

.start-card{position:relative;width:min(470px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:var(--card);border-radius:30px;padding:22px 24px 26px;text-align:center;box-shadow:var(--shadow);border:5px solid #f3d3a5;animation:pop .7s cubic-bezier(.3,1.5,.6,1)}
.start-card .kicker{display:inline-block;background:#ffe6c7;color:var(--orange-d);border-radius:999px;padding:4px 14px;font-family:Jua,sans-serif;font-size:16px}
.start-card h1{font-family:Jua,sans-serif;font-weight:normal;font-size:clamp(32px,8vw,42px);line-height:1.15;margin:10px 0 4px;color:var(--orange-d);text-shadow:0 3px 0 #ffe0b8}
.hero{width:128px;height:171px;margin:0 auto}
.start-card p{margin:6px 0 14px;color:var(--soft);line-height:1.5}
.start-card label{display:block;font-family:Jua,sans-serif;font-size:18px;margin-bottom:6px}
.start-card label small{font-family:"Gowun Dodum",sans-serif;font-size:13px;color:var(--soft)}
#nameInput{width:100%;max-width:300px;font-size:22px;text-align:center;padding:10px;border:3px solid #edcfa5;border-radius:16px;font-family:Jua,sans-serif;outline:none;margin-bottom:14px;background:#fff;color:#111;caret-color:#111}
#nameInput::placeholder{color:#9a8a7a}
#nameInput:focus{border-color:var(--orange)}
.err{color:var(--red);min-height:20px;margin-top:8px;font-size:15px}
.teacher-btn{display:block;margin:14px auto 0;border:2px dashed #e0bf93;background:#fff7ec;border-radius:16px;padding:9px 16px;font-family:Jua,sans-serif;font-size:16px;color:var(--orange-d);cursor:pointer}
.teacher-btn small{font-family:"Gowun Dodum",sans-serif;font-size:12px;color:var(--soft)}
.teacher-btn:hover{background:#ffeed8}

.qcard{width:min(590px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;background:var(--card);border-radius:26px;border:4px solid #f3d3a5;box-shadow:var(--shadow);overflow:hidden}
.qcard.pop{animation:pop .75s cubic-bezier(.3,1.45,.55,1)}
.qcard.flip{animation:flip .55s ease}
.qcard.shake{animation:shake .45s}
@keyframes pop{0%{transform:scale(.25) rotate(-8deg);opacity:0}60%{transform:scale(1.05) rotate(1deg);opacity:1}100%{transform:none}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#questOverlay.result{background:rgba(45,30,18,.06);align-items:flex-start}
#questOverlay.result .qcard{max-height:min(64dvh,calc(100dvh - 24px))}
.qhead{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(#ffb76a,#f0954a);color:#fff}
.qhead.good{background:linear-gradient(#8ad65e,#58ac38)}
.qhead.calm{background:linear-gradient(#7fbcf0,#4e95d6)}
.qbadge{font-family:Jua,sans-serif;background:rgba(255,255,255,.28);border-radius:999px;padding:3px 11px;font-size:16px;white-space:nowrap}
.qtitle{font-family:Jua,sans-serif;font-size:21px;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.chances{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.chances i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.chances i.on{background:#fff6c9;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.qbody{padding:16px 18px 10px;overflow:auto;font-size:17px;line-height:1.55}
.qtext small{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.qfoot{display:flex;gap:10px;justify-content:center;padding:12px 18px 16px;border-top:2px dashed #f0dcc0}
.notice{background:#e8f4ff;color:#1f5f99;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:15px}
.formula{background:#fff2dc;border-radius:14px;padding:10px 14px;margin:10px 0;text-align:center;font-family:Jua,sans-serif;font-size:19px;line-height:1.4}
.formula b{color:var(--orange-d);font-weight:normal;font-size:23px}
.fig{display:flex;justify-content:center;margin:8px 0}
.fig svg{width:100%;max-width:400px;height:auto}
.fig.sm svg{max-width:270px}
.hint .fig{margin:6px 0 0}
.hint.flash{animation:hflash 1.4s ease}
@keyframes hflash{0%,40%{background:#ffe27a;transform:scale(1.02)}100%{background:#fff9d4;transform:none}}
.solution .fig{margin:6px 0}
.solution p{line-height:1.6}
.t-card .wr{font-size:12.5px;line-height:1.5}
.choices{margin-top:8px}
.choice{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;margin:8px 0;border:3px solid #eedcc2;border-radius:16px;background:#fff;font-size:16px;line-height:1.4;transition:transform .1s}
.choice:active{transform:scale(.98)}
.choice .cnum{font-family:Jua,sans-serif;color:var(--orange-d)}
.choice.sel{border-color:var(--blue);background:#eaf4ff}
.choice.bad{border-color:#f2a49c;background:#fff0ee}
.ans{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
#ansInput{width:150px;font-size:28px;text-align:center;padding:8px;border:3px solid #e9cfa7;border-radius:16px;font-family:Jua,sans-serif;outline:none;background:#fff}
#ansInput:focus{border-color:var(--orange)}
.unit{font-family:Jua,sans-serif;font-size:24px}
.hint{display:none;background:#fff9d4;border:2px solid #f3d75e;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:15.5px}
.hint.show{display:block;animation:slide .5s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.feedback{min-height:24px;text-align:center;margin-top:10px;font-weight:bold;font-size:15.5px}
.feedback.bad{color:var(--red)}
.feedback.info{color:#1f5f99}
.solution{background:#f1fbe8;border:2px solid #b8e19a;border-radius:16px;padding:10px 14px;margin-top:8px}
.solution h3{margin:0 0 4px;font-family:Jua,sans-serif;font-weight:normal;font-size:19px;color:#3f8a24}
.solution p{margin:6px 0}
.praise{font-family:Jua,sans-serif;font-size:22px;text-align:center;margin:2px 0 6px;color:var(--orange-d)}

.pad-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 8px}
.tool{border:2px solid #e9cfa7;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.tool.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pad-wrap{display:flex;justify-content:center}
.pad canvas{touch-action:none;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff}
.pad-tip{text-align:center;font-size:13.5px;color:var(--soft);margin-top:6px}

.end-card{width:min(460px,100%);background:var(--card);border-radius:28px;border:5px solid #f3d3a5;box-shadow:var(--shadow);padding:20px 22px 24px;text-align:center;animation:pop .8s cubic-bezier(.3,1.45,.55,1);margin-top:4px}
.end-card h2{font-family:Jua,sans-serif;font-weight:normal;font-size:30px;margin:4px 0;color:var(--orange-d)}
.end-stats{display:flex;justify-content:center;gap:12px;margin:14px 0}
.end-stats div{background:#fff2dc;border-radius:16px;padding:10px 16px;min-width:110px}
.end-stats b{display:block;font-family:Jua,sans-serif;font-weight:normal;font-size:24px}
.end-stats span{font-size:13px;color:var(--soft)}
.end-note{font-size:14px;color:var(--soft);margin-bottom:14px}
#endOverlay{background:rgba(45,30,18,.08);align-items:flex-start}

.t-card{width:min(900px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.t-card h2{font-family:Jua,sans-serif;font-weight:normal;margin:0 0 6px}
.t-card .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.t-card table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.t-card th,.t-card td{border-bottom:1px solid #eee;padding:6px;text-align:left;vertical-align:top}
.t-card th{background:#fff4e4;position:sticky;top:0}
.t-card .o{color:#3f8a24;font-weight:bold}.t-card .x{color:var(--red);font-weight:bold}
.t-note{font-size:13.5px;color:var(--soft);background:#f7f3ec;border-radius:10px;padding:8px 10px}
#pinInput{font-size:20px;padding:8px 12px;border:2px solid #ddd;border-radius:10px;width:140px;text-align:center}
@media (max-width:520px){
  .qtitle{font-size:18px}.qbody{font-size:16px;padding:14px 14px 8px}.chances span{display:none}
  .pill{font-size:16px;padding:5px 11px}.steps i{width:11px;height:11px}
}

.pbar{display:flex;gap:3px;margin-bottom:2px}.pbar i{width:20px;height:12px;border-radius:4px;background:#e8e2d3;display:block}
.pbar i.d{background:#6cc04a}.pbar i.c{background:#ffb84d;animation:pb 1s infinite alternate}.pbar i.w{box-shadow:inset 0 -4px 0 #e5533d}
@keyframes pb{to{opacity:.45}}
tr.stale td{opacity:.55}tr.done td{background:#f1fbe9}tr.detail td{background:#fff8ec;text-align:left}
.chip{display:inline-block;background:#fff2dc;border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px}
#tSort{padding:6px;border-radius:8px;border:2px solid #e3d3b0;font-family:inherit}
</style>
</head>
<body>
<div id="game">
  <div id="stage">
    <div class="layer" id="skyL">
      <div class="sun"></div>
      <div class="cloud" style="left:6%;top:70px"></div>
      <div class="cloud" style="left:38%;top:40px;transform:scale(.8);animation-duration:46s"></div>

/* =====================================================================
   그림(SVG) 만들기  — 길이는 색깔 점선(치수선)으로 표시해요
   ===================================================================== */
const C_H = "#1f6fd1", C_V = "#1c9441", C_S = "#e2641f", C_RECT = "#5b4636", C_Q = "#d0392f", C_LINE = "#8a6a52";
function tw(t) { let w = 0; for (const ch of String(t)) w += /[가-힣㉮㉯□]/.test(ch) ? 19 : ch === " " ? 6 : 11; return w; }
function pill(x, y, t, color, anchor = "middle") {
  const w = tw(t) + 20, h = 30, x0 = anchor === "start" ? x : anchor === "end" ? x - w : x - w / 2;
  return `<g><rect x="${x0}" y="${y - h / 2}" width="${w}" height="${h}" rx="15" fill="#fff" stroke="${color}" stroke-width="2.5"/><text x="${x0 + w / 2}" y="${y + 7}" text-anchor="middle" font-family="Jua,sans-serif" font-size="19" fill="${color}">${t}</text></g>`;
}

    ctx.clearRect(0, 0, cv.width, cv.height);

    ctx.lineWidth = 1;

function polyArea(h) { let s = 0; for (let i = 0; i < h.length; i++) { const a = h[i], b = h[(i + 1) % h.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }
function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy; let t = L2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }
function analyzeRhombus(points) {
  if (points.length < 3) return { empty: true };
  const h = convexHull(points); if (h.length < 3) return { empty: true };
  const area = polyArea(h); if (area < 1) return { empty: true };
  let L = 0, A, B;
  for (let i = 0; i < h.length; i++) for (let j = i + 1; j < h.length; j++) { const d = Math.hypot(h[i][0] - h[j][0], h[i][1] - h[j][1]); if (d > L) { L = d; A = h[i]; B = h[j]; } }
  const ux = (B[0] - A[0]) / L, uy = (B[1] - A[1]) / L, vx = -uy, vy = ux;
  let mn = Infinity, mx = -Infinity, pmn, pmx;
  for (const p of h) { const s = (p[0] - A[0]) * vx + (p[1] - A[1]) * vy; if (s < mn) { mn = s; pmn = p; } if (s > mx) { mx = s; pmx = p; } }
  const W = mx - mn;
  const t1 = ((pmn[0] - A[0]) * ux + (pmn[1] - A[1]) * uy) / L, t2 = ((pmx[0] - A[0]) * ux + (pmx[1] - A[1]) * uy) / L;
  let near = 0;
  for (const q of points) { const p = [q.x, q.y]; let d = Infinity; for (let i = 0; i < h.length && d >= .6; i++) d = Math.min(d, segDist(p, h[i], h[(i + 1) % h.length])); if (d < .6) near++; }
  return { L, W, area, fill: area / (L * W), t1, t2, edge: near / points.length };
}
function judgeRhombus(r, target, TOL = .8) {
  const big = Math.max(...target), small = Math.min(...target);
  const lenOK = Math.abs(r.L - big) <= TOL && Math.abs(r.W - small) <= TOL;
  const shapeOK = r.fill > .36 && r.fill < .68 && r.t1 > .2 && r.t1 < .8 && r.t2 > .2 && r.t2 < .8 && r.edge >= .55;
  return { ok: lenOK && shapeOK, lenOK, shapeOK };
}

const S = { name: "", session: "", startedAt: 0, qi: 0, vi: 0, wrong: 0, hintOn: false, acorns: 0, sqX: START_X, camX: 0, viewW: 1000, scale: 1,
  muted: false, phase: "idle", sel: null, pad: null, tries: QUESTS.map(() => 0), wrongs: QUESTS.map(() => 0), hinted: QUESTS.map(() => false),
  wrongLog: [], qStart: QUESTS.map(() => 0), qTime: QUESTS.map(() => null), done: QUESTS.map(() => false) };
const S0 = JSON.stringify(S);
const card = () => $("#qcard");

function layout() {
  const W = innerWidth, H = innerHeight, s = Math.min(H / DH, W / 560);
  S.scale = s; S.viewW = W / s;
  const st = $("#stage"); st.style.transform = `scale(${s})`; st.style.top = (H - DH * s) + "px"; st.style.width = S.viewW + "px";
  updateCam(); if (S.pad) S.pad.resize();
}
function updateCam() {
  S.camX = Math.max(0, Math.min(WORLD_W - S.viewW, S.sqX - S.viewW * .38));
  $("#farL").style.transform = `translateX(${-S.camX * .15}px)`;
  $("#midL").style.transform = `translateX(${-S.camX * .45}px)`;
  $("#groundL").style.transform = `translateX(${-S.camX}px)`;
}
function placeSq() { const el = $("#sq"); el.style.left = S.sqX + "px"; el.style.top = pathY(S.sqX) + "px"; }

function walkTo(x, done) {
  const from = S.sqX, dist = Math.abs(x - from), dur = Math.max(400, dist / CONFIG.WALK_SPEED * 1000), el = $("#sq");
  el.classList.add("walking"); el.classList.toggle("flip", x < from);
  const t0 = performance.now(); let lastDust = 0;
  (function f(t) {
    const k = Math.min(1, (t - t0) / dur), e = k < .12 ? k * k / .24 : k > .88 ? 1 - (1 - k) * (1 - k) / .24 : k; // 부드럽게 출발·도착
    S.sqX = from + (x - from) * Math.min(1, Math.max(0, e)); placeSq(); updateCam();
    if (t - lastDust > 260 && k < .95) { lastDust = t; dust(); }
    if (k < 1) requestAnimationFrame(f); else { el.classList.remove("walking"); done && done(); }
  })(t0);
}
function dust() { const d = document.createElement("div"); d.className = "dust"; d.style.left = (S.sqX - 22) + "px"; d.style.top = (pathY(S.sqX) - 10) + "px"; $("#groundL").appendChild(d); setTimeout(() => d.remove(), 800); }
function jump() { const el = $("#sq"); el.classList.remove("jump"); void el.offsetWidth; el.classList.add("jump"); }

function updateHUD(bump) {

  $("#steps").innerHTML = QUESTS.map((_, i) => `<i class="${i < S.acorns ? "done" : i === S.acorns ? "now" : ""}"${i < S.acorns ? ` style="background:${NUTRIENTS[i].color}"` : ""}></i>`).join("");
  if (bump) { const p = $("#acPill"); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump"); }
}

function startGame() {
  const name = $("#nameInput").value.trim();

  ac();
  S.started = true;
  S.name = name; S.session = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); S.startedAt = Date.now();
  record({ event: "start" });
  clearInterval(S.hb); S.hb = setInterval(() => record({ event: "ping" }), CONFIG.PING_MS);
  $("#nametag").textContent = name;
  $("#hudName").textContent = "🥔 " + name;
  $("#startOverlay").classList.remove("show");
  $("#hud").hidden = false; updateHUD();

}

function arrive(i) {

  setTimeout(() => { SFX.chime(); openQuest(i); }, 450);
}

function openQuest(i) {

  record({ event: "quest", quest: i + 1 });

  animateCard("pop");
}
function animateCard(c) { const el = card(); el.classList.remove("pop", "flip", "shake"); void el.offsetWidth; el.classList.add(c); }
function nextVersion() { const n = QUESTS[S.qi].versions.length; if (n > 1) S.vi = (S.vi + 1) % n; }
function chancesHTML() {
  const left = Math.max(0, CONFIG.RETRIES - S.wrong);
  let h = '<span>남은 기회</span>'; for (let i = 0; i < CONFIG.RETRIES; i++) h += `<i class="${i < left ? "on" : ""}"></i>`; return h;
}
function say(msg, cls = "bad") { const fb = $("#fb"); if (fb) { fb.className = "feedback " + cls; fb.innerHTML = msg; } }

function renderQuest(notice) {
  const Q = QUESTS[S.qi], v = Q.versions[S.vi];
  const q = val(Q, v, "q"), fig = val(Q, v, "fig"), hint = val(Q, v, "hint");
  let ans = "";
  S.pad = null; S.sel = null;
  if (Q.type === "choice") {
    const ch = val(Q, v, "choices"), order = shuffle(ch.map((_, i) => i));
    ans = `<div class="choices${Q.pics ? " pics" : ""}">${order.map((i, n) => `<button class="choice" data-i="${i}"><span class="cnum">${"①②③④⑤⑥"[n]}</span><span class="ctext">${typeof ch[i] === "string" ? ch[i] : ch[i].html}</span></button>`).join("")}</div>`;
  } else if (Q.type === "number") {
    ans = `<div class="ans"><input id="ansInput" inputmode="decimal" autocomplete="off" placeholder="?"><span class="unit">${val(Q, v, "unit")}</span></div>`;
  } else ans = `<div id="padHost" class="pad"></div>`;
  card().innerHTML = `
    <div class="qhead"><span class="qbadge">퀘스트 ${S.qi + 1}</span><span class="qtitle">${Q.title}</span><span class="chances">${chancesHTML()}</span></div>
    <div class="qbody">
      ${notice ? `<div class="notice">${notice}</div>` : ""}
      <div class="qtext">${q}</div>
      ${fig ? `<div class="fig">${fig}</div>` : ""}
      ${ans}
      <div class="hint ${S.hintOn ? "show" : ""}"><b>💡 힌트</b><div>${hint}</div></div>
      <div class="feedback" id="fb" aria-live="polite"></div>
    </div>
    <div class="qfoot"><button class="btn" id="submitBtn">정답 확인</button></div>`;
  card().querySelector(".qbody").scrollTop = 0;
  card().querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
    S.sel = Number(b.dataset.i); card().querySelectorAll(".choice").forEach(c => c.classList.toggle("sel", c === b)); say("", "");
  }));
  const inp = $("#ansInput"); if (inp) { inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); }); inp.addEventListener("input", () => say("", "")); }
  if (Q.type === "draw") { const [c, r] = Q.grid || [12, 10]; S.pad = DrawPad($("#padHost"), c, r); S.pad.onchange = () => say("", ""); }
  $("#submitBtn").addEventListener("click", submit);
  S.phase = "question";
}

function submit() {
  if (S.phase !== "question") return;
  const Q = QUESTS[S.qi], v = Q.versions[S.vi];
  let correct = false, given = "", extra = "";
  if (Q.type === "choice") {
    if (S.sel === null) return say("답을 하나 골라 주세요!", "info");
    { const c = val(Q, v, "choices")[S.sel]; given = typeof c === "string" ? plain(c) : c.text; } correct = S.sel === val(Q, v, "answer");
  } else if (Q.type === "number") {
    const raw = $("#ansInput").value.trim().replace(/,/g, "").replace(/\s/g, "");
    if (!raw) return say("답을 적어 주세요!", "info");
    const n = Number(raw); if (!isFinite(n)) return say("숫자만 적어 주세요! (단위는 쓰지 않아도 돼요)", "info");
    given = `${raw} ${val(Q, v, "unit") || ""}`.trim(); correct = Math.abs(n - val(Q, v, "answer")) < 1e-6;
  } else {
    const r = analyzeRhombus(S.pad.points());
    if (r.empty) return say("먼저 모눈종이에 마름모를 그려 주세요!", "info");
    const j = judgeRhombus(r, val(Q, v, "target"));
    correct = j.ok;
    given = `그림: 대각선 약 ${half(r.L)}cm, ${half(r.W)}cm (넓이 약 ${half(r.L * r.W / 2)}cm²)${j.shapeOK ? "" : " / 모양 다름"}`;
    if (!correct) extra = j.shapeOK ? `내가 그린 마름모의 대각선은 약 <b>${half(r.L)} cm</b>와 <b>${half(r.W)} cm</b>예요.`
      : "마름모 모양이 조금 달라요. 꼭짓점 4개를 이어 닫힌 마름모를 그리고, 두 대각선이 가운데에서 직각으로 만나게 해 봐요.";
  }
  S.tries[S.qi]++;
  const qsec = Math.round((Date.now() - S.qStart[S.qi]) / 1000);
  if (correct) { S.done[S.qi] = true; S.qTime[S.qi] = qsec; }
  const brief = briefOf(Q, v), correctText = correctOf(Q, v);
  if (!correct) { S.wrongs[S.qi]++; S.wrongLog.push({ quest: S.qi + 1, version: S.vi + 1, brief, answer: given, correct: correctText }); }
  record({ event: "answer", quest: S.qi + 1, version: S.vi + 1, question: brief, answer: given, correctAnswer: correctText, correct, try: S.tries[S.qi], hint: S.hintOn, questTime: qsec });
  correct ? onCorrect() : onWrong(extra);
}

function onWrong(extra) {
  S.wrong++; SFX.wrong(); animateCard("shake");
  const pre = extra ? extra + "<br>" : "";
  if (S.wrong <= CONFIG.RETRIES) {
    // 틀리면 바로 힌트를 보여 주고, 한 번 더 도전할 수 있어요
    S.hintOn = true; S.hinted[S.qi] = true;
    const h = card().querySelector(".hint");
    if (h) { h.classList.add("show"); h.classList.remove("flash"); void h.offsetWidth; h.classList.add("flash"); setTimeout(() => h.scrollIntoView({ behavior: "smooth", block: "nearest" }), 120); }
    const left = CONFIG.RETRIES - S.wrong;
    say(`${pre}아쉬워요! 위의 <b>💡 힌트</b>를 보고 다시 도전해 봐요. (다시 풀기 기회 ${left}번 남았어요)`);
    const ch = card().querySelector(".chances"); if (ch) ch.innerHTML = chancesHTML();
    if (S.sel !== null) { const b = card().querySelector(`.choice[data-i="${S.sel}"]`); if (b) b.classList.replace("sel", "bad"); S.sel = null; }
    const inp = $("#ansInput"); if (inp) { inp.focus(); inp.select(); }
  } else {
    S.phase = "reveal";
    setTimeout(renderReveal, 900);
    say(`${pre}괜찮아요! 같이 풀어 봐요.`);
  }
}

  });
}

const PRAISE = ["정답이에요! 최고예요!", "와, 딱 맞았어요!", "정답! 정말 잘했어요!", "멋져요, 정답이에요!", "대단해요! 정답!", "완벽해요! 정답이에요!"];

    const go = () => { if ($("#pinInput").value === CONFIG.TEACHER_PIN) { teacherOK = true; openTeacherLocal(); } else $("#pinErr").textContent = "비밀번호가 달라요."; };

  }
  let rows = []; try { rows = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { }
  const sess = {};
  rows.forEach(r => { const s = sess[r.sessionId] = sess[r.sessionId] || { name: r.name, start: r.time }; if (r.summary) s.sum = r.summary; });
  const t = iso => new Date(iso).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const cls = p => p.startsWith("O") ? "o" : p.startsWith("X") ? "x" : "";
  const sum = Object.values(sess).reverse().map(s => {
    const m = s.sum || { perQuest: [], perTime: [] };
    const per = QUESTS.map((_, i) => { const p = m.perQuest[i] || "-"; return `<td class="${cls(p)}">${esc(p)}${m.perTime[i] ? `<br><small>${m.perTime[i]}</small>` : ""}</td>`; }).join("");
    return `<tr><td>${esc(s.name)}</td><td>${t(s.start)}</td><td class="${m.achieved === "달성" ? "o" : "x"}">${esc(m.achieved || "")}</td>${per}<td>${esc(m.wrongQuests || "")}</td><td class="wr">${(m.wrongDetail || []).map(esc).join("<br>")}</td><td>${esc(m.totalTime || "")}</td></tr>`;
  }).join("");
  const ans = rows.filter(r => r.event === "answer").reverse();
  const det = ans.slice(0, 300).map(r => `<tr><td>${t(r.time)}</td><td>${esc(r.name)}</td><td>${r.quest}-${r.version}</td><td class="wr">${esc(r.question)}</td><td>${esc(r.answer)}</td><td>${esc(r.correctAnswer || "")}</td><td class="${r.correct ? "o" : "x"}">${r.correct ? "O" : "X"}</td><td>${r.try}</td><td>${r.hint ? "예" : ""}</td><td>${fmtT(r.questTime)}</td></tr>`).join("");
  const wrongRows = ans.filter(r => !r.correct).slice(0, 300).map(r => `<tr><td>${t(r.time)}</td><td>${esc(r.name)}</td><td>${r.quest}번 (문제 ${r.version})</td><td class="wr">${esc(r.question)}</td><td class="x">${esc(r.answer)}</td><td class="o">${esc(r.correctAnswer || "")}</td></tr>`).join("");
  c.innerHTML = `<h2>선생님 화면 · 풀이 기록</h2>
    <div class="t-note">${CONFIG.SHEET_URL ? "모든 학생의 기록은 <b>구글 시트</b>에 모여요. 아래 표는 <b>이 기기</b>에서 푼 기록만 보여 줘요." : "⚠️ 아직 구글 시트가 연결되지 않아서 <b>이 기기</b>에서 푼 기록만 볼 수 있어요. README의 ‘기록 모으기’를 따라 연결해 주세요."}</div>
    <div class="row">${CONFIG.SHEET_VIEW_URL ? `<a class="btn small" href="${esc(CONFIG.SHEET_VIEW_URL)}" target="_blank" rel="noopener" style="text-decoration:none">구글 시트 열기</a>` : ""}
      <button class="btn small gray" id="clrBtn">이 기기 기록 지우기</button><button class="btn small gray" id="tClose">닫기</button></div>
    <h3>학생별 요약</h3>
    <div style="overflow-x:auto"><table><tr><th>이름</th><th>시작</th><th>최종 퀘스트 달성</th>${QUESTS.map((_, i) => `<th>${i + 1}번<br><small>정답 · 걸린 시간</small></th>`).join("")}<th>오답 발생 문항</th><th>틀린 문제 · 고른 오답 · 정답</th><th>총 시간</th></tr>${sum || `<tr><td colspan="${QUESTS.length + 6}">아직 기록이 없어요.</td></tr>`}</table></div>
    <h3 style="margin-top:16px">오답 노트 <small>(어떤 문제를 틀렸고, 학생이 어떤 답을 골랐는지)</small></h3>
    <div style="overflow-x:auto"><table><tr><th>시각</th><th>이름</th><th>틀린 문제</th><th>문제 내용</th><th>학생이 고른 오답</th><th>정답</th></tr>${wrongRows || `<tr><td colspan="6">틀린 문제가 없어요.</td></tr>`}</table></div>
    <h3 style="margin-top:16px">제출 기록 (최근 순)</h3>
    <div style="overflow-x:auto"><table><tr><th>시각</th><th>이름</th><th>퀘스트-문제</th><th>문제 내용</th><th>제출한 답</th><th>정답</th><th>맞음</th><th>시도</th><th>힌트 본 뒤</th><th>그 문제에 쓴 시간</th></tr>${det}</table></div>`;
  $("#tClose").onclick = () => ov.classList.remove("show");
  $("#clrBtn").onclick = () => { if (confirm("이 기기에 저장된 기록을 모두 지울까요? (구글 시트 기록은 지워지지 않아요)")) { localStorage.removeItem(LS_KEY); openTeacherLocal(); } };
}

/* ---------- 실시간 선생님 화면 (구글 시트 연결 시) ---------- */
let tPin = "", tTimer = null, tData = null, tSort = "start", tOpen = {};
function stopLive() { clearInterval(tTimer); tTimer = null; }
function openTeacher() {
  if (!CONFIG.SHEET_URL) return openTeacherLocal();
  const ov = $("#teacherOverlay"), c = $("#tCard"); ov.classList.add("show");
  if (tPin) return startLive();
  c.innerHTML = `<h2>선생님 화면</h2><p>숫자 4자리 비밀번호를 입력해 주세요.</p>
    <div class="row"><input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn small" id="pinBtn">확인</button><button class="btn small gray" id="tClose">닫기</button></div><div class="err" id="pinErr"></div>`;
  const go = async () => {
    const v = $("#pinInput").value.trim(); if (!/^\d{4}$/.test(v)) { $("#pinErr").textContent = "숫자 4자리를 입력해 주세요."; return; }
    $("#pinErr").textContent = "확인 중…";
    const r = await fetchDash(v);
    if (r.ok) { tPin = v; tData = r; startLive(); }
    else $("#pinErr").textContent = r.error === "pin" ? `비밀번호가 달라요. (남은 기회 ${r.left}번)` : r.error === "locked" ? "너무 많이 틀렸어요. 5분 뒤에 다시 해 주세요." : "서버에 연결하지 못했어요. 인터넷과 SHEET_URL을 확인해 주세요.";
  };
  $("#pinBtn").onclick = go; $("#pinInput").onkeydown = e => { if (e.key === "Enter") go(); }; $("#tClose").onclick = () => ov.classList.remove("show");
  setTimeout(() => $("#pinInput").focus(), 50);
}
async function fetchDash(pin) {
  try {
    const r = await fetch(`${CONFIG.SHEET_URL}?action=dashboard&pin=${encodeURIComponent(pin)}&_=${Date.now()}`, { cache: "no-store" });
    return await r.json();
  } catch (e) { return { ok: false, error: "network" }; }
}
function startLive() {
  stopLive(); renderLive();
  const tick = async () => {
    if (!$("#teacherOverlay").classList.contains("show")) return stopLive();
    const r = await fetchDash(tPin);
    if (r.ok) { tData = r; tData.err = ""; }
    else if (r.error === "pin" || r.error === "locked") { tPin = ""; stopLive(); return openTeacher(); }
    else if (tData) tData.err = "연결이 잠깐 끊겼어요. 다시 시도하는 중…";
    renderLive();
  };
  tick(); tTimer = setInterval(tick, CONFIG.POLL_MS);
}
function renderLive() {
  const c = $("#tCard"), d = tData || { students: [], now: Date.now() };
  const STALE = 3 * CONFIG.PING_MS + 30000;
  const list = (d.students || []).map(s => {
    const age = d.now - s.last, fin = !!s.finished;
    const st = fin ? "done" : age > STALE ? "stale" : "live";
    const el = Math.max(0, Math.round(((fin ? s.last : d.now) - s.startedAt) / 1000));
    return Object.assign({}, s, { st, age, el, nWrong: s.totalWrong || 0 });
  });
  const by = { start: (a, b) => a.startedAt - b.startedAt, wrong: (a, b) => b.nWrong - a.nWrong, slow: (a, b) => a.nutrients - b.nutrients || a.startedAt - b.startedAt, name: (a, b) => a.name.localeCompare(b.name, "ko") };
  list.sort(by[tSort]);
  const cnt = k => list.filter(x => x.st === k).length;
  const stTxt = { live: "🟢 푸는 중", done: "🌸 완주!", stale: "⚪ 신호 없음" };
  const bar = s => `<div class="pbar">${QUESTS.map((_, i) => `<i class="${s.doneArr && s.doneArr[i] ? "d" : s.current === i + 1 && s.st !== "done" ? "c" : ""}${s.wrongsArr && s.wrongsArr[i] ? " w" : ""}" title="${i + 1}번${s.wrongsArr && s.wrongsArr[i] ? " · 오답 " + s.wrongsArr[i] + "회" : ""}"></i>`).join("")}</div>`;
  const rows = list.map(s => {
    const wq = (s.wrongsArr || []).map((w, i) => w ? `${i + 1}번(${w}회)` : "").filter(Boolean).join(", ") || "-";
    const open = tOpen[s.sessionId];
    return `<tr class="${s.st}" data-sid="${esc(s.sessionId)}" style="cursor:pointer"><td><b>${esc(s.name)}</b></td><td>${bar(s)}<small>${s.nutrients}/${QUESTS.length} 완료</small></td><td>${s.st === "done" ? "-" : (s.current || 1) + "번"}</td><td>${stTxt[s.st]}${s.st === "stale" ? `<br><small>${fmtT(Math.round(s.age / 1000))} 전</small>` : ""}</td><td class="${s.nWrong ? "x" : "o"}">${s.nWrong}회</td><td>${esc(wq)}</td><td>${fmtT(s.el)}</td></tr>` +
      (open ? `<tr class="detail"><td colspan="7"><div class="wr">${(s.wrongDetail || []).length ? s.wrongDetail.map(esc).join("<br>") : "틀린 문제가 없어요 👍"}</div><small>${(s.perQuest || []).map((p, i) => `${i + 1}번 ${esc(p)}${s.perTime && s.perTime[i] ? " · " + esc(s.perTime[i]) : ""}`).join(" / ")}</small></td></tr>` : "");
  }).join("");
  c.innerHTML = `<h2>선생님 화면 · 실시간 진행 <small style="font-size:13px">(${CONFIG.POLL_MS / 1000}초마다 자동 갱신)</small></h2>
    <div class="t-note">${d.err ? "⚠️ " + esc(d.err) : `마지막 갱신 ${new Date(d.now).toLocaleTimeString("ko-KR")} · 이름을 누르면 틀린 문제와 고른 답이 펼쳐져요. · 기록은 마지막 활동 후 3시간 동안만 보관돼요.`}</div>
    <div class="row"><span class="chip">👥 전체 ${list.length}</span><span class="chip">🟢 푸는 중 ${cnt("live")}</span><span class="chip">🌸 완주 ${cnt("done")}</span><span class="chip">⚪ 신호 없음 ${cnt("stale")}</span>
      <select id="tSort"><option value="start">시작 순</option><option value="wrong">오답 많은 순</option><option value="slow">진행 느린 순</option><option value="name">이름 순</option></select>
      ${CONFIG.SHEET_VIEW_URL ? `<a class="btn small" href="${esc(CONFIG.SHEET_VIEW_URL)}" target="_blank" rel="noopener" style="text-decoration:none">구글 시트 열기</a>` : ""}
      <button class="btn small gray" id="tLock">🔒 잠그고 닫기</button></div>
    <div style="overflow-x:auto"><table><tr><th>이름</th><th>진행 (1~${QUESTS.length}번)</th><th>지금 푸는 문제</th><th>상태</th><th>오답</th><th>틀린 문항</th><th>경과 시간</th></tr>${rows || `<tr><td colspan="7">아직 시작한 학생이 없어요.</td></tr>`}</table></div>`;
  $("#tSort").value = tSort; $("#tSort").onchange = e => { tSort = e.target.value; renderLive(); };
  c.querySelectorAll("tr[data-sid]").forEach(tr => tr.onclick = () => { tOpen[tr.dataset.sid] = !tOpen[tr.dataset.sid]; renderLive(); });
  $("#tLock").onclick = () => { stopLive(); tPin = ""; tData = null; $("#teacherOverlay").classList.remove("show"); };
}
function downloadCSV(rows) {
  const head = ["시각", "이름", "세션", "이벤트", "퀘스트", "문제버전", "문제 내용", "제출한 답", "정답", "정답여부", "시도", "힌트 본 뒤 제출", "그 문제에 쓴 시간(초)", "전체 걸린시간(초)", "최종 퀘스트 달성", "오답 발생 문항", "틀린 문제·고른 오답·정답", ...QUESTS.map((_, i) => `${i + 1}번 정답`), ...QUESTS.map((_, i) => `${i + 1}번 시간`)];
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = rows.map(r => { const m = r.summary || { perQuest: [], perTime: [] }; return [r.time, r.name, r.sessionId, r.event, r.quest, r.version, r.question, r.answer, r.correctAnswer, r.correct === undefined ? "" : (r.correct ? "O" : "X"), r.try, r.hint ? "예" : "", r.questTime, r.elapsed, m.achieved, m.wrongQuests, (m.wrongDetail || []).join(" / "), ...QUESTS.map((_, i) => m.perQuest[i]), ...QUESTS.map((_, i) => m.perTime[i])].map(q).join(","); });
  const blob = new Blob(["﻿" + [head.join(","), ...lines].join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "감자새싹_마름모_기록.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* =====================================================================
   시작
   ===================================================================== */
buildScene();
$("#hero").innerHTML = potatoSVG("h"); setStage(3, $("#hero"));
$("#hudAcorn").innerHTML = SPROUT_ICON;
placeSq(); layout();
addEventListener("resize", layout);
$("#startBtn").addEventListener("click", startGame);
$("#nameInput").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });
$("#nameInput").addEventListener("input", () => $("#nameErr").textContent = "");
$("#teacherLink").addEventListener("click", openTeacher);
$("#muteBtn").addEventListener("click", () => { S.muted = !S.muted; $("#muteBtn").textContent = S.muted ? "🔇" : "🔊"; });
</script>
